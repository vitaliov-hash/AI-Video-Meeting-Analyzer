name: quality

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Tests
        run: python -m pytest -q -p no:cacheprovider
      - name: Ruff
        run: python -m ruff check meeting_analyzer tests scripts
      - name: Compile Python
        run: python -m compileall -q meeting_analyzer tests scripts
      - name: Check JavaScript and Vercel build
        run: |
          node --check static/app.js
          node --check static/showcase.js
          node --check scripts/build_frontend.mjs
          node scripts/test_showcase_mode.mjs
          node scripts/verify_frontend_build.mjs
          node scripts/build_frontend.mjs --showcase
      - name: Package sanitized DZ Pro submission
        run: python scripts/package_dz_pro.py
      - name: Check repository and archive hygiene
        run: python scripts/security_check.py --archive dist/AI-Video-Meeting-Analyzer-DZ-Pro.zip --archive-optional
